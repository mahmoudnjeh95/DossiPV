# Production compose file for the DossiPV server (217.182.205.137).
# Lives in the repo so changes are versioned; the deploy workflow copies this
# file to /home/debian/dossipv/docker-compose.yml and runs `docker compose up`
# there. The `postgres` service mirrors what's already running on the server
# (same container name / volume / network) so adding `app` here and deploying
# does not recreate or disturb the existing database.
#
# `app` is bound to 127.0.0.1 only — nginx (outside Docker) is the only public
# entry point, proxying from the public port to 127.0.0.1:3100. See
# deploy/nginx-dossipv.conf.

services:
  postgres:
    image: postgres:18-alpine
    container_name: dossipv-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: dossipv
      POSTGRES_USER: dossipv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - dossipv_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dossipv -d dossipv']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dossipv_default

  app:
    image: dossipv-web:${IMAGE_TAG:-latest}
    container_name: dossipv-app-1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dossipv:${POSTGRES_PASSWORD}@postgres:5432/dossipv
      FILE_STORAGE_ROOT: /app/apps/web/.file-storage
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Public base URL used in e-mail links. SMTP_* / ADMIN_EMAIL: transactional e-mail and the
      # admin alerts (failed jobs). SENTRY_DSN: error monitoring, off when empty. All come from the
      # .env the deploy workflow writes; see docs/runbooks/monitoring.md.
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Online payment (docs/runbooks/online-payments.md); a provider is offered only when set.
      FLOUCI_APP_TOKEN: ${FLOUCI_APP_TOKEN:-}
      FLOUCI_APP_SECRET: ${FLOUCI_APP_SECRET:-}
      FLOUCI_BASE_URL: ${FLOUCI_BASE_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Satellite imagery of the dossier maps (worker) falls back to Esri when empty.
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
    ports:
      - '127.0.0.1:3100:3000'
    volumes:
      - dossipv_files:/app/apps/web/.file-storage
    # Same check as the external uptime monitor (GET /api/health also queries the database). The
    # image has no curl, hence Node's fetch. Docker only marks the container unhealthy (visible in
    # `docker ps`); `restart: unless-stopped` still covers crashes.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dossipv_default

  # Dossier generation worker: the web app only queues jobs (status PENDING); this process claims
  # and runs them. Same image as `app`; shares the file volume so the web app can serve its output.
  worker:
    image: dossipv-web:${IMAGE_TAG:-latest}
    container_name: dossipv-worker-1
    restart: unless-stopped
    command: ['node', 'node_modules/tsx/dist/cli.mjs', 'packages/dossier-worker/src/start.ts']
    environment:
      DATABASE_URL: postgresql://dossipv:${POSTGRES_PASSWORD}@postgres:5432/dossipv
      FILE_STORAGE_ROOT: /app/apps/web/.file-storage
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Public base URL used in e-mail links. SMTP_* / ADMIN_EMAIL: transactional e-mail and the
      # admin alerts (failed jobs). SENTRY_DSN: error monitoring, off when empty. All come from the
      # .env the deploy workflow writes; see docs/runbooks/monitoring.md.
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Satellite imagery of the dossier maps (worker) falls back to Esri when empty.
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
    volumes:
      - dossipv_files:/app/apps/web/.file-storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dossipv_default

networks:
  dossipv_default:
    name: dossipv_default

volumes:
  dossipv_pgdata:
    name: dossipv_pgdata
  dossipv_files:
    name: dossipv_files
