# DossiPV nginx config.
#
# ai.solarixpro.com: served on port 80 first, then upgraded to HTTPS by certbot (see below).
# The legacy 217.182.205.137:3001 entry stays available as a fallback until the domain works.
#
# Install (once, on the server; CI does not touch nginx):
#   sudo cp deploy/nginx-dossipv.conf /etc/nginx/sites-available/dossipv
#   sudo ln -sf /etc/nginx/sites-available/dossipv /etc/nginx/sites-enabled/dossipv
#   sudo nginx -t && sudo systemctl reload nginx
#   # The DNS A record of ai.solarixpro.com must point to this server first. Then:
#   sudo certbot --nginx -d ai.solarixpro.com --redirect
# certbot adds the 443 server block and the redirect to this file. Afterwards set the
# DEPLOY_APP_URL secret to https://ai.solarixpro.com so email links use the domain.

server {
    listen 80;
    listen [::]:80;
    server_name ai.solarixpro.com;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        # $http_host keeps the exact host the browser used. $host would strip a port, which
        # makes Next.js reject every Server Action (x-forwarded-host != origin header).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Fallback by IP and port, plain HTTP.
server {
    listen 3001;
    listen [::]:3001;
    server_name _;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
