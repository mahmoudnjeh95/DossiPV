# DossiPV — plain HTTP on a dedicated port, no domain yet.
#
# No Let's Encrypt cert is possible without a domain, so this serves plain
# HTTP directly on the public port below. Traffic (including the session
# cookie) is unencrypted until a domain is pointed at this server — treat
# that as a follow-up, not as done.
#
# Install: copy to /etc/nginx/sites-available/dossipv, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`.

server {
    listen 3001;
    listen [::]:3001;
    server_name _;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
