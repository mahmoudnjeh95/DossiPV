name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dossipv
          POSTGRES_USER: dossipv
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dossipv -d dossipv"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://dossipv:ci-test-password@localhost:5432/dossipv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: packages/db
        run: npm run generate

      - name: Apply database migrations
        working-directory: packages/db
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy:
    name: Build & deploy to server
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy over SSH
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.DEPLOY_POSTGRES_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.DEPLOY_ANTHROPIC_API_KEY }}
          # Optional: an unset secret is an empty value, which leaves that feature off.
          APP_URL: ${{ secrets.DEPLOY_APP_URL }}
          SMTP_HOST: ${{ secrets.DEPLOY_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.DEPLOY_SMTP_PORT }}
          SMTP_USER: ${{ secrets.DEPLOY_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.DEPLOY_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.DEPLOY_SMTP_FROM }}
          ADMIN_EMAIL: ${{ secrets.DEPLOY_ADMIN_EMAIL }}
          SENTRY_DSN: ${{ secrets.DEPLOY_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.DEPLOY_NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.DEPLOY_NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pinned to the server's real host keys (captured first-hand over
          # an already-trusted SSH session, not fetched over the network at
          # CI time) — ssh-keyscan alone is trust-on-first-use and would
          # accept whatever key a MITM presented on the runner's first
          # connection.
          cat deploy/known_hosts >> ~/.ssh/known_hosts

          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes $SSH_USER@$SSH_HOST"

          # Ship the tracked source tree to a build dir on the server
          # (same approach validated manually: tar the git-tracked files,
          # stream over SSH, extract).
          git archive --format=tar HEAD | $SSH "mkdir -p /home/debian/dossipv-release && tar -xf - -C /home/debian/dossipv-release"

          # Build the image on the server, tagged with the commit SHA. The browser DSN is a build
          # arg because Next inlines NEXT_PUBLIC_* at build time (it is public by design: it ships
          # in the JS bundle).
          $SSH "cd /home/debian/dossipv-release && docker build --build-arg NEXT_PUBLIC_SENTRY_DSN='$NEXT_PUBLIC_SENTRY_DSN' --build-arg NEXT_PUBLIC_MAPBOX_TOKEN='$NEXT_PUBLIC_MAPBOX_TOKEN' -t dossipv-web:${{ github.sha }} -t dossipv-web:latest ."

          # Write the runtime .env for compose (never echoed/logged; heredoc
          # stays inside the remote shell).
          $SSH "umask 077 && cat > /home/debian/dossipv/.env" <<EOF
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          # Single quotes keep a value literal for Docker Compose: an address like
          # DossiPV <noreply@dossipv.tn> or a password with a space would otherwise break the file.
          # (A value must therefore not contain a single quote, a dollar sign or a line break.)
          APP_URL='$APP_URL'
          SMTP_HOST='$SMTP_HOST'
          SMTP_PORT='${SMTP_PORT:-587}'
          SMTP_USER='$SMTP_USER'
          SMTP_PASSWORD='$SMTP_PASSWORD'
          SMTP_FROM='$SMTP_FROM'
          ADMIN_EMAIL='$ADMIN_EMAIL'
          SENTRY_DSN='$SENTRY_DSN'
          MAPBOX_ACCESS_TOKEN='$NEXT_PUBLIC_MAPBOX_TOKEN'
          IMAGE_TAG=${{ github.sha }}
          EOF

          # Deploy the compose file from this checkout.
          cat deploy/docker-compose.yml | $SSH "cat > /home/debian/dossipv/docker-compose.yml"

          # Apply pending migrations with the new image before rolling app and
          # worker, so neither starts against an old schema. If a migration
          # fails, set -e stops here and the previous containers keep running.
          $SSH "cd /home/debian/dossipv && docker compose up -d --wait postgres"
          $SSH "cd /home/debian/dossipv && docker compose run --rm --no-deps -w /app/packages/db app npx prisma migrate deploy"

          # Roll app and worker. Postgres is unaffected unless its config
          # actually changed (compose only recreates services whose config
          # differs).
          $SSH "cd /home/debian/dossipv && docker compose up -d --remove-orphans"

          # Clean up the build dir, and old dossipv-web images only (this
          # server runs several unrelated apps — a blanket `docker image
          # prune` would touch their images too). Keeps the current + the
          # just-superseded tag, drops anything older.
          $SSH "rm -rf /home/debian/dossipv-release"
          $SSH "docker images dossipv-web --format '{{.Tag}}' | grep -v -E '^(latest|${{ github.sha }})$' | xargs -r -I{} docker rmi dossipv-web:{} || true"
